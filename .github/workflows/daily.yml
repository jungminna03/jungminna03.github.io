name: Daily update

# 매일 아침: 채용 공고 수집 + AI 추천, 게임 트렌드 카드뉴스 생성 → 바뀐 게 있으면 커밋하고 배포
on:
  schedule:
    - cron: '0 22 * * *' # 매일 07:00 KST (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch:
    inputs:
      force_cardnews:
        description: '오늘 카드뉴스를 다시 만들기'
        type: boolean
        default: false

permissions:
  contents: write # 데이터 커밋
  actions: write # 배포 워크플로 실행

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 없으면 AI 없이 동작
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }} # 비워두면 claude-opus-5-5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 채용 공고 수집 + AI 추천
        id: jobs
        continue-on-error: true
        run: npm run jobs

      - name: 게임 트렌드 카드뉴스
        id: cardnews
        continue-on-error: true
        run: npm run cardnews -- ${{ inputs.force_cardnews && '--force' || '' }}

      - name: 바뀐 데이터 커밋 후 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/data src/content/cardnews
          if git diff --cached --quiet; then
            echo "변경 없음 — 배포하지 않음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: daily update $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
          # GITHUB_TOKEN 으로 한 push 는 다른 워크플로를 실행하지 않으니 배포를 직접 실행한다
          gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"

      - name: 실패한 단계 알림
        if: steps.jobs.outcome == 'failure' || steps.cardnews.outcome == 'failure'
        run: |
          echo "::error::채용(${{ steps.jobs.outcome }}) · 카드뉴스(${{ steps.cardnews.outcome }}) 중 실패한 단계가 있어요. 위 로그를 확인하세요."
          exit 1
