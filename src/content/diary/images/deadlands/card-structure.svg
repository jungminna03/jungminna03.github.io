<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-labelledby="title">
  <title id="title">강화 카드 구조: 카드 시스템은 Abstract 강화 카드와 상호작용하고, 카드들은 그것을 상속한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#3b2418" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; fill: #3b2418; text-anchor: middle; }
    .b { font-weight: 700; }
    .sub { font-size: 14px; fill: #6b5246; }
    .box { stroke: #3b2418; stroke-width: 3; }
    .line { stroke: #3b2418; stroke-width: 3; fill: none; }
  </style>

  <!-- 카드 시스템 ↔ Abstract 강화 카드 -->
  <rect class="box" x="21.5" y="31.5" width="177" height="58" fill="#f2e5c4" />
  <text class="b" x="110" y="67" font-size="17">카드 시스템</text>

  <line class="line" x1="213" y1="60" x2="287" y2="60" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text class="sub" x="250" y="46">상호작용</text>

  <rect class="box" x="301.5" y="21.5" width="277" height="78" fill="#f3d78a" />
  <text class="b" x="440" y="54" font-size="17">Abstract 강화 카드</text>
  <text class="sub" x="440" y="79">Abstract 클래스 · Abstract 프리팹</text>

  <!-- 상속 -->
  <path class="line" d="M440 117 V150 M105 150 H495 M105 150 V188 M300 150 V188 M495 150 V188" />
  <path d="M440 101 L430 118 H450 Z" fill="#fff" stroke="#3b2418" stroke-width="3" stroke-linejoin="miter" />
  <text class="sub" x="474" y="139">상속</text>

  <rect class="box" x="21.5" y="189.5" width="167" height="66" fill="#f5dfc7" />
  <text class="b" x="105" y="229" font-size="16">공격 속도 증가</text>

  <rect class="box" x="216.5" y="189.5" width="167" height="66" fill="#f5dfc7" />
  <text class="b" x="300" y="229" font-size="16">분열탄</text>

  <rect class="box" x="411.5" y="189.5" width="167" height="66" fill="#fff" stroke-dasharray="8 6" />
  <text class="b" x="495" y="229" font-size="16">새 카드</text>
  <text class="sub" x="495" y="281">그래픽을 갈아 끼우고</text>
  <text class="sub" x="495" y="301">상속받은 컴포넌트를 붙인다</text>
</svg>
