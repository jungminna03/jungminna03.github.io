<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="title">
  <title id="title">적 구조: 적마다 이동 속도와 모양을 담은 SO 가 있고, 적 생성 팩토리가 적을 만든다. 적의 행동은 모두 같다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#3b2418" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; fill: #3b2418; text-anchor: middle; }
    .b { font-weight: 700; }
    .sub { font-size: 14px; fill: #6b5246; }
    .box { stroke: #3b2418; stroke-width: 3; }
    .line { stroke: #3b2418; stroke-width: 3; fill: none; }
  </style>

  <!-- 적마다 SO -->
  <rect class="box" x="21.5" y="21.5" width="167" height="78" fill="#f2e5c4" />
  <text class="b" x="105" y="54" font-size="16">적 SO</text>
  <text class="sub" x="105" y="79">이동 속도 · 모양</text>

  <rect class="box" x="216.5" y="21.5" width="167" height="78" fill="#f2e5c4" />
  <text class="b" x="300" y="54" font-size="16">적 SO</text>
  <text class="sub" x="300" y="79">이동 속도 · 모양</text>

  <rect class="box" x="411.5" y="21.5" width="167" height="78" fill="#fff" stroke-dasharray="8 6" />
  <text class="b" x="495" y="54" font-size="16">새 적 SO</text>
  <text class="sub" x="495" y="79">이동 속도 · 모양</text>

  <path class="line" d="M105 101 V135 H300 M495 101 V135 H300" />
  <line class="line" x1="300" y1="101" x2="300" y2="160" marker-end="url(#arrow)" />

  <!-- 팩토리 -->
  <rect class="box" x="21.5" y="175.5" width="557" height="76" fill="#f6e6b8" />
  <text class="b" x="300" y="206" font-size="17">적 생성 팩토리</text>
  <text class="sub" x="300" y="232">새 적을 추가할 때 손보는 곳</text>

  <line class="line" x1="300" y1="253" x2="300" y2="280" marker-end="url(#arrow)" />

  <!-- 적 -->
  <rect class="box" x="181.5" y="295.5" width="237" height="76" fill="#f5dfc7" />
  <text class="b" x="300" y="327" font-size="17">적</text>
  <text class="sub" x="300" y="353">행동은 모두 같다</text>

  <text class="sub" x="300" y="404">새 적 = SO 하나 만들고 팩토리만 손본다</text>
</svg>
